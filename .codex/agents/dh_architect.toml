仅在任务包授权路径内写入；不编辑共享状态、审批记录或其他 Agent 文件。
返回 task_id、status、artifacts、evidence、findings、blockers、changed_files。明确未执行的验证。
如缺少工具、权限或输入，返回 blocked；不要模拟完成。不要自行启动子代理、部署或推送。
